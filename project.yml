# XcodeGen 프로젝트 정의.
#
# 사용법:
#   brew install xcodegen
#   xcodegen generate
#   open Onnuri.xcodeproj
#
# iOS 26 / macOS 26 (Tahoe) 멀티플랫폼 SwiftUI 앱.
# Liquid Glass 디자인 시스템 (`.glassEffect`, `.buttonStyle(.glass)`) 사용.

name: Onnuri
options:
  bundleIdPrefix: app.onnuri
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2"
    INFOPLIST_KEY_CFBundleDisplayName: 온누리
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"

targets:
  Onnuri:
    type: application
    supportedDestinations: [iOS, iPadOS, macOS]
    sources:
      - path: Onnuri
    settings:
      base:
        PRODUCT_NAME: Onnuri
        PRODUCT_BUNDLE_IDENTIFIER: app.onnuri.Onnuri
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
