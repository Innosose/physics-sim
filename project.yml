# XcodeGen 프로젝트 정의 — iOS / iPadOS 전용.
#
#   brew install xcodegen
#   xcodegen generate
#   open ImunDe.xcodeproj

name: ImunDe
options:
  bundleIdPrefix: app.imunde
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.4"
    INFOPLIST_KEY_CFBundleDisplayName: 이문데
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"

targets:
  ImunDe:
    type: application
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: ImunDe
    settings:
      base:
        PRODUCT_NAME: ImunDe
        PRODUCT_BUNDLE_IDENTIFIER: app.imunde.ImunDe
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
